name: macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    uses: ./.github/workflows/apple-toolchain.yml

  build-macos-dmg:
    name: Build, Sign & Notarize macOS DMG
    needs: toolchain
    runs-on: ${{ needs.toolchain.outputs.runner }}
    env:
      DEVELOPER_DIR: ${{ needs.toolchain.outputs.developer_dir }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Extract version from CHANGELOG
        id: changelog
        run: |
          python3 - << 'PYEOF'
          import re, sys

          content = open('CHANGELOG.md').read()

          m = re.search(r'## \[([\d+\.\d+\.\d+][^\]]*)\]', content)
          if not m:
              print('::error::No version found in CHANGELOG.md')
              sys.exit(1)
          version = m.group(1)

          m_notes = re.search(
              r'## \[[^\]]+\][^\n]*\n(.*?)(?=\n## \[|\Z)',
              content, re.DOTALL
          )
          notes = m_notes.group(1).strip() if m_notes else ''

          with open('RELEASE_VERSION', 'w') as f:
              f.write(version)
          with open('RELEASE_NOTES.md', 'w') as f:
              f.write(notes)

          print(f'Version: {version}')
          PYEOF
          echo "version=$(cat RELEASE_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create Secrets.xcconfig
        env:
          VOTICE_API_KEY: ${{ secrets.VOTICE_API_KEY }}
          VOTICE_API_SECRET: ${{ secrets.VOTICE_API_SECRET }}
          VOTICE_APP_ID: ${{ secrets.VOTICE_APP_ID }}
        run: |
          echo "::add-mask::$VOTICE_API_KEY"
          echo "::add-mask::$VOTICE_API_SECRET"
          echo "::add-mask::$VOTICE_APP_ID"

          cat > Secrets.xcconfig << 'EOF'
          VOTICE_API_KEY = $(VOTICE_API_KEY_PLACEHOLDER)
          VOTICE_API_SECRET = $(VOTICE_API_SECRET_PLACEHOLDER)
          VOTICE_APP_ID = $(VOTICE_APP_ID_PLACEHOLDER)
          EOF
          sed -i '' \
            -e "s|\$(VOTICE_API_KEY_PLACEHOLDER)|$VOTICE_API_KEY|g" \
            -e "s|\$(VOTICE_API_SECRET_PLACEHOLDER)|$VOTICE_API_SECRET|g" \
            -e "s|\$(VOTICE_APP_ID_PLACEHOLDER)|$VOTICE_APP_ID|g" \
            Secrets.xcconfig

      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode \
            > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Install provisioning profiles
        id: profiles
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          MACOS_WIDGETS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          install_profile() {
            local encoded_profile="$1"
            local output_name="$2"
            local profile_path="$RUNNER_TEMP/${output_name}.provisionprofile"
            local plist_path="$RUNNER_TEMP/${output_name}.plist"

            printf '%s' "$encoded_profile" | base64 --decode > "$profile_path"
            security cms -D -i "$profile_path" > "$plist_path"

            local profile_uuid
            local profile_name
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist_path")
            profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist_path")

            cp "$profile_path" "$PP_DIR/${profile_uuid}.provisionprofile"
            echo "${output_name}_profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          }

          install_profile "$MACOS_PROVISIONING_PROFILE_BASE64" app
          install_profile "$MACOS_WIDGETS_PROVISIONING_PROFILE_BASE64" widgets

      - name: Create ExportOptions.plist
        env:
          MACOS_APP_PROFILE_NAME: ${{ steps.profiles.outputs.app_profile_name }}
          MACOS_WIDGETS_PROFILE_NAME: ${{ steps.profiles.outputs.widgets_profile_name }}
        run: |
          python3 - << 'PYEOF'
          import os
          import plistlib

          options = {
              "method": "developer-id",
              "teamID": "Q4X55987WE",
              "signingStyle": "manual",
              "provisioningProfiles": {
                  "com.artcc.openclient-llm": os.environ["MACOS_APP_PROFILE_NAME"],
                  "com.artcc.openclient-llm.macos-widgets": os.environ["MACOS_WIDGETS_PROFILE_NAME"],
              },
          }

          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as file:
              plistlib.dump(options, file)

          signing_config = f'''\
          PROFILE_SPECIFIER_com_artcc_openclient_llm = {os.environ["MACOS_APP_PROFILE_NAME"]}
          PROFILE_SPECIFIER_com_artcc_openclient_llm_macos_widgets = {os.environ["MACOS_WIDGETS_PROFILE_NAME"]}
          PROVISIONING_PROFILE_SPECIFIER = $(PROFILE_SPECIFIER_$(PRODUCT_BUNDLE_IDENTIFIER:identifier))
          '''

          with open(os.path.join(os.environ["RUNNER_TEMP"], "Signing.xcconfig"), "w") as file:
              file.write(signing_config)
          PYEOF

      - name: Archive macOS app
        run: |
          set +e
          set -o pipefail

          xcodebuild archive \
            -project openclient-llm.xcodeproj \
            -scheme openclient-llm-macOS \
            -destination 'platform=macOS' \
            -archivePath "$RUNNER_TEMP/openclient-llm.xcarchive" \
            -xcconfig "$RUNNER_TEMP/Signing.xcconfig" \
            DEVELOPMENT_TEAM=Q4X55987WE \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | xcpretty

          archive_status=${PIPESTATUS[0]}
          set -e

          if [ "$archive_status" -ne 0 ]; then
            echo "::group::Filtered xcodebuild archive errors"
            grep -Ei \
              'error:|provisioning profile|code.?sign|signing certificate|requires a provisioning profile|does not match|no profiles' \
              "$RUNNER_TEMP/archive.log" | tail -n 200 || true
            echo "::endgroup::"
            exit "$archive_status"
          fi

      - name: Export archive
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/openclient-llm.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            2>&1 | xcpretty && exit ${PIPESTATUS[0]}

      - name: Create DMG
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/export" -name "*.app" -maxdepth 1 | head -1)
          DMG_PATH="$RUNNER_TEMP/OpenClient-LLM-${{ steps.changelog.outputs.version }}.dmg"
          STAGING="$RUNNER_TEMP/dmg_staging"

          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "OpenClient" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --key ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m

      - name: Staple notarization ticket
        run: xcrun stapler staple "$DMG_PATH"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.changelog.outputs.version }}-macos"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            "$DMG_PATH"

      - name: Clean up
        if: always()
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 || true
